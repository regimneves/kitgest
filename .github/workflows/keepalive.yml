name: Keep Supabase awake

# Projetos Supabase no plano free pausam após ~7 dias sem atividade.
# Este workflow bate no banco 2x por semana (seg e qui) para gerar tráfego
# e manter o intervalo < 7 dias — o KitGest nunca dorme.
#
# Um projeto PAUSADO não estabelece conexão (curl devolve código 000).
# Um projeto ATIVO responde algum HTTP (200 com sessão, 401 sem — ambos provam
# que o servidor está de pé). Por isso: 000 = alerta; qualquer outro = ok.

on:
  schedule:
    - cron: "0 9 * * 1,4"   # 09:00 UTC toda segunda e quinta
  workflow_dispatch:          # permite rodar manualmente pelo botão do Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (KitGest)
        run: |
          URL="https://geltxfbwrqmacshwaveh.supabase.co"
          KEY="sb_publishable_MnG02iBufzW0rQ9taraJ1A_jdIvP_US"
          code=$(curl -s -o /dev/null --max-time 30 -w "%{http_code}" \
            "$URL/rest/v1/orgs?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Resposta do banco: HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::error::Sem conexão com o Supabase — projeto pode estar PAUSADO. Reative no dashboard."
            exit 1
          fi
          echo "Banco acordado (respondeu HTTP $code) — atividade registrada."
